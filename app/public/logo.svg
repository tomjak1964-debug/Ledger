<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ledger's mark, "Double Entry": two L's that lock into one square, like
       debits and credits that balance. Paths only, so rasterizers need no fonts. -->
  <rect width="512" height="512" rx="112" fill="#13233B"/>
  <path d="M104 104 H192 V320 H408 V408 H104 Z" fill="#FFFFFF"/>
  <path d="M224 104 H408 V288 H320 V192 H224 Z" fill="#1F6FEB"/>
</svg>
