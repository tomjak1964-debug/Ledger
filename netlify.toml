# Netlify deploy config. The app lives in app/; this builds it from the repo
# root and publishes the Vite output. Set VITE_SUPABASE_URL and
# VITE_SUPABASE_ANON_KEY in Site settings → Environment variables (the anon
# key only — never a service-role key).

[build]
  command = "npm --prefix app install && npm --prefix app run build"
  publish = "app/dist"

# /reset is a real page — the one that clears a stuck cached copy of the app —
# so it has to win over the SPA fallback below.
[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200

# The app itself lives under /app; everything there serves its shell.
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Anything else serves the public landing page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
