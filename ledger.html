<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Quote to Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#13233B;          /* blueprint navy: structure, sidebar, headings */
    --ink-soft:#1D3350;
    --canvas:#EDF0F4;        /* cool light gray app bg */
    --surface:#FFFFFF;
    --line:#D9DFE7;
    --line-soft:#E7EBF1;
    --accent:#1F6FEB;        /* interactive / brand */
    --accent-deep:#0E4FB0;
    --accent-wash:#E8F0FE;
    --muted:#5B6B80;
    --muted-2:#8A98A9;
    --pos:#197A56;           /* money in / paid */
    --pos-wash:#E4F3EC;
    --warn:#9A6B12;          /* pending / open */
    --warn-wash:#FBF0DA;
    --neg:#B23A2E;           /* overdue / money out */
    --neg-wash:#FBE8E5;
    --radius:10px;
    --radius-sm:7px;
    --shadow:0 1px 2px rgba(19,35,59,.06), 0 6px 20px rgba(19,35,59,.06);
    --shadow-sm:0 1px 2px rgba(19,35,59,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--canvas);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif;margin:0;letter-spacing:-.01em}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--accent);text-decoration:none}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .sidebar{
    background:var(--ink);
    color:#C6D2E2;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:22px 22px;
  }
  .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.07)}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,var(--accent),#5B9BFF);
    display:grid;place-items:center;color:#fff;font-family:"Space Grotesk";font-weight:700;
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
  }
  .brand-name{color:#fff;font-family:"Space Grotesk";font-weight:600;font-size:15px;line-height:1.1}
  .brand-sub{font-size:11px;color:#7E90A8;letter-spacing:.08em;text-transform:uppercase}
  .nav{padding:12px 12px;overflow-y:auto;flex:1}
  .nav-group{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#66788F;padding:14px 10px 6px;font-weight:600}
  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:8px 10px;border-radius:8px;border:0;background:transparent;
    color:#C6D2E2;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;
    transition:background .12s,color .12s;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
  .nav-item .ico{width:17px;height:17px;flex:none;opacity:.9}
  .nav-item .count{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px}
  .nav-item.active .count{background:rgba(255,255,255,.22)}
  .sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#66788F}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(237,240,244,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 28px;display:flex;align-items:center;gap:16px;
  }
  .topbar h1{font-size:21px;font-weight:600}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .topbar-actions{margin-left:auto;display:flex;gap:9px}
  .content{padding:24px 28px 60px;max-width:1180px;width:100%}

  /* ---------- primitives ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;
    transition:.12s;white-space:nowrap;box-shadow:var(--shadow-sm);
  }
  .btn:hover{border-color:#BFC9D6;background:#FBFCFD}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
  .btn.ghost:hover{background:rgba(19,35,59,.05);color:var(--ink)}
  .btn.danger{color:var(--neg);border-color:var(--neg-wash)}
  .btn.danger:hover{background:var(--neg-wash);border-color:var(--neg)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.icon{padding:7px;box-shadow:none}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-head{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
  .card-head h3{font-size:15px;font-weight:600}
  .card-body{padding:18px}

  .grid{display:grid;gap:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .stat .val{font-family:"IBM Plex Mono";font-size:26px;font-weight:600;margin-top:7px;letter-spacing:-.02em}
  .stat .meta{font-size:12px;color:var(--muted-2);margin-top:3px}
  .stat .val.pos{color:var(--pos)} .stat .val.neg{color:var(--neg)}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .badge.gray{background:#EDF1F5;color:#5B6B80} .badge.gray .dot{background:#8A98A9}
  .badge.blue{background:var(--accent-wash);color:var(--accent-deep)} .badge.blue .dot{background:var(--accent)}
  .badge.amber{background:var(--warn-wash);color:var(--warn)} .badge.amber .dot{background:#C88A1E}
  .badge.green{background:var(--pos-wash);color:var(--pos)} .badge.green .dot{background:var(--pos)}
  .badge.red{background:var(--neg-wash);color:var(--neg)} .badge.red .dot{background:var(--neg)}

  table{width:100%;border-collapse:collapse}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:#F6F8FB}
  td.num,th.num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
  .doc-id{font-family:"IBM Plex Mono";font-weight:600;font-size:13px}
  .subtle{color:var(--muted);font-size:12.5px}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .field .hint{font-size:11.5px;color:var(--muted-2)}
  .input,.select,textarea.input{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--surface);color:var(--ink);outline:none;transition:.12s;
  }
  .input:focus,.select:focus,textarea.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  textarea.input{resize:vertical;min-height:64px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>.field{flex:1;min-width:150px}

  /* line items editor */
  .li-table th{padding:8px 10px}
  .li-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft)}
  .li-table .input{padding:7px 9px}
  .li-desc{min-width:220px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(19,35,59,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal{background:var(--surface);border-radius:14px;box-shadow:0 24px 60px rgba(19,35,59,.28);width:100%;max-width:760px;animation:pop .16s ease-out}
  .modal.wide{max-width:940px}
  @keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
  .modal-head h2{font-size:18px;font-weight:600}
  .modal-body{padding:22px;max-height:70vh;overflow-y:auto}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;background:#FBFCFD;border-radius:0 0 14px 14px}

  .empty{text-align:center;padding:52px 20px;color:var(--muted)}
  .empty .big{font-family:"Space Grotesk";font-size:17px;color:var(--ink);font-weight:600;margin-bottom:6px}
  .empty svg{opacity:.5;margin-bottom:12px}

  .pill-tabs{display:inline-flex;background:#E2E7EE;border-radius:9px;padding:3px;gap:2px}
  .pill-tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
  .pill-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .totals{margin-left:auto;width:290px}
  .totals .line{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
  .totals .line.grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:17px;font-weight:700;font-family:"Space Grotesk"}
  .totals .amt{font-family:"IBM Plex Mono";font-weight:600}

  /* pipeline signature */
  .pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
  .stage{padding:16px 16px 18px;position:relative}
  .stage:not(:last-child)::after{
    content:"";position:absolute;right:-1px;top:22px;bottom:22px;width:1px;background:var(--line);
  }
  .stage .arrow{position:absolute;right:-9px;top:50%;transform:translateY(-50%);z-index:2;color:var(--muted-2);background:var(--surface);border:1px solid var(--line);border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
  .stage .st-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .stage .st-count{font-family:"Space Grotesk";font-size:30px;font-weight:600;margin-top:6px;line-height:1}
  .stage .st-val{font-family:"IBM Plex Mono";font-size:13px;color:var(--muted);margin-top:6px}
  .stage.q .st-count{color:var(--muted)} .stage.q .marker{background:#8A98A9}
  .stage.s .st-count{color:var(--accent)} .stage.s .marker{background:var(--accent)}
  .stage.i .st-count{color:var(--warn)} .stage.i .marker{background:#C88A1E}
  .stage.p .st-count{color:var(--pos)} .stage.p .marker{background:var(--pos)}
  .stage .marker{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:middle}

  .aging{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .aging .bucket{border:1px solid var(--line);border-radius:9px;padding:12px}
  .aging .bucket .b-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .aging .bucket .b-val{font-family:"IBM Plex Mono";font-size:18px;font-weight:600;margin-top:6px}
  .aging .bucket.hot .b-val{color:var(--neg)}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search{position:relative;flex:1;max-width:280px}
  .search input{padding-left:32px}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:200;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;animation:pop .16s}

  .link-btn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:inherit}
  .divider{height:1px;background:var(--line-soft);margin:18px 0}
  .tag-x{cursor:pointer;color:var(--muted-2);margin-left:4px}
  .cat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}

  /* ---------- printable document ---------- */
  .doc-screen{position:fixed;inset:0;background:#6b7280;z-index:150;overflow-y:auto;padding:28px 16px}
  .doc-bar{max-width:820px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end}
  .printable{
    max-width:820px;margin:0 auto;background:#fff;color:#111827;
    padding:52px 56px;box-shadow:0 12px 40px rgba(0,0,0,.3);border-radius:2px;
    font-family:"Inter",sans-serif;
  }
  .doc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:34px}
  .doc-co h2{font-family:"Space Grotesk";font-size:20px}
  .doc-co .co-meta{font-size:12px;color:#4b5563;margin-top:6px;white-space:pre-line;line-height:1.5}
  .doc-title{text-align:right}
  .doc-title .t{font-family:"Space Grotesk";font-size:30px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#111827}
  .doc-title .n{font-family:"IBM Plex Mono";font-size:14px;color:#374151;margin-top:4px}
  .doc-parties{display:flex;justify-content:space-between;gap:30px;margin-bottom:26px}
  .doc-parties .blk .h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#6b7280;font-weight:700;margin-bottom:6px}
  .doc-parties .blk .b{font-size:13px;line-height:1.5;white-space:pre-line}
  .doc-meta-grid{display:flex;gap:26px;font-size:12px;text-align:right}
  .doc-meta-grid .m .h{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;font-weight:700}
  .doc-meta-grid .m .v{font-family:"IBM Plex Mono";font-weight:600;margin-top:2px}
  table.doc-items{width:100%;border-collapse:collapse;margin-bottom:22px}
  table.doc-items th{background:#13233B;color:#fff;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;text-align:left;font-weight:600}
  table.doc-items th.r,table.doc-items td.r{text-align:right}
  table.doc-items td{padding:11px 12px;border-bottom:1px solid #e5e7eb;font-size:13px;vertical-align:top}
  table.doc-items td.mono{font-family:"IBM Plex Mono"}
  .doc-tot{display:flex;justify-content:flex-end}
  .doc-tot .box{width:270px}
  .doc-tot .l{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
  .doc-tot .l.g{border-top:2px solid #13233B;margin-top:5px;padding-top:9px;font-size:17px;font-weight:700;font-family:"Space Grotesk"}
  .doc-tot .l .v{font-family:"IBM Plex Mono";font-weight:600}
  .doc-notes{margin-top:30px;font-size:12px;color:#374151;border-top:1px solid #e5e7eb;padding-top:16px;white-space:pre-line}
  .doc-foot{margin-top:26px;text-align:center;font-size:11px;color:#9ca3af}

  @media print{
    body{background:#fff}
    .doc-screen{position:static;background:#fff;padding:0}
    .doc-bar{display:none}
    .printable{box-shadow:none;max-width:none;padding:0;margin:0}
    @page{margin:16mm}
  }

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;width:236px}
    .sidebar.open{transform:none}
    .content{padding:18px}
    .pipeline{grid-template-columns:repeat(2,1fr)}
    .stage:nth-child(-n+2)::after{display:none}
    .aging{grid-template-columns:1fr 1fr}
    .totals{width:100%}
  }
  .menu-btn{display:none}
  @media(max-width:900px){.menu-btn{display:inline-flex}}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useCallback,useRef} = React;

/* ============================ persistence ============================ */
const STORE_KEY = "ledger:v1";
function loadState(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }
  catch(e){ /* storage blocked -> in-memory */ }
  return null;
}
function saveState(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
}

/* ============================ helpers ============================ */
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (iso,n)=>{ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const daysBetween = (a,b)=> Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
const money = (n)=> (n<0?"-":"")+"$"+Math.abs(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = (iso)=> iso ? new Date(iso+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
const cls = (...a)=>a.filter(Boolean).join(" ");
const sum = (arr,f)=>arr.reduce((t,x)=>t+(f?f(x):x),0);

function lineTotals(items, taxRate){
  const sub = sum(items, i => (Number(i.qty)||0)*(Number(i.unitPrice)||0));
  const tax = sub*(Number(taxRate)||0)/100;
  return { sub, tax, total: sub+tax };
}
function paid(doc){ return sum(doc.payments||[], p=>Number(p.amount)||0); }
function balance(doc){ return round2(lineTotals(doc.lineItems,doc.taxRate).total - paid(doc)); }
const round2 = n => Math.round((n+Number.EPSILON)*100)/100;

function invoiceStatus(inv){
  const t = lineTotals(inv.lineItems,inv.taxRate).total;
  const p = paid(inv);
  if(p >= t-0.005 && t>0) return "paid";
  if(inv.dueDate && inv.dueDate < todayISO() && p < t) return "overdue";
  if(p>0) return "partial";
  return "unpaid";
}
function billStatus(bill){
  const p = paid(bill);
  if(p >= (Number(bill.amount)||0)-0.005) return "paid";
  if(bill.dueDate && bill.dueDate < todayISO()) return "overdue";
  if(p>0) return "partial";
  return "unpaid";
}

    {id:uid(),type:"customer",name:"Apex Bottling Co.",contact:"Marcus Bell",email:"mbell@apexbottling.com",phone:"(419) 555-0192",address:"88 Canal St\nToledo, OH 43604"},
  ];
  const vend=[

    {id:uid(),type:"vendor",name:"McMaster-Carr",contact:"",email:"",phone:"",address:""},
  ];
  const catalog=[
    {id:uid(),desc:"Controls engineering — PLC/HMI programming",unit:"hour",unitPrice:145},
    {id:uid(),desc:"Field service — startup & commissioning",unit:"hour",unitPrice:165},
    {id:uid(),desc:"On-site travel",unit:"hour",unitPrice:95},
    {id:uid(),desc:"UL508A control panel build (per panel)",unit:"each",unitPrice:0},
    {id:uid(),desc:"Field wiring & installation support",unit:"hour",unitPrice:110},
    {id:uid(),desc:"FANUC robot integration & teach",unit:"hour",unitPrice:155},
  ];
  return {
    settings:{
      company:"Northbridge Controls, LLC",
      companyAddress:"27 Foundry Lane, Suite 200\nKalamazoo, MI 49007",

function Badge({status}){
  const map={
    draft:["gray","Draft"], sent:["blue","Sent"], accepted:["green","Accepted"], declined:["red","Declined"],
    open:["blue","Open"], invoiced:["green","Invoiced"], fulfilled:["green","Fulfilled"],
    unpaid:["amber","Unpaid"], partial:["blue","Partial"], paid:["green","Paid"], overdue:["red","Overdue"]
  };
  const [c,l]=map[status]||["gray",status];
  return <span className={"badge "+c}><span className="dot"></span>{l}</span>;
}
function Stat({label,value,meta,tone}){

/* ============================ Dashboard ============================ */
function Dashboard({db,go}){
  const openQuotes=db.quotes.filter(q=>q.status==="draft"||q.status==="sent");
  const openSOs=db.salesOrders.filter(s=>s.status==="open");
  const openInv=db.invoices.filter(i=>["unpaid","partial","overdue"].includes(invoiceStatus(i)));
  const valQ=sum(openQuotes,q=>lineTotals(q.lineItems,q.taxRate).total);
  const valS=sum(openSOs,s=>lineTotals(s.lineItems,s.taxRate).total);
  const valI=sum(openInv,i=>balance(i));
  const collected30=sum(db.invoices,inv=>sum((inv.payments||[]).filter(p=>daysBetween(p.date,todayISO())<=30&&daysBetween(p.date,todayISO())>=0),p=>Number(p.amount)||0));
  const arOut=sum(db.invoices,i=>balance(i)>0?balance(i):0);
  const apOut=sum(db.bills,b=>{const bal=(Number(b.amount)||0)-paid(b);return bal>0?bal:0;});
  const exp30=sum(db.expenses.filter(e=>daysBetween(e.date,todayISO())<=30&&daysBetween(e.date,todayISO())>=0),e=>Number(e.amount)||0);
  const overdue=db.invoices.filter(i=>invoiceStatus(i)==="overdue");

  const recent=[
    ...db.quotes.map(q=>({t:q.date,k:"quote",id:q.id,label:q.number,who:nameOf(db,q.customerId),amt:lineTotals(q.lineItems,q.taxRate).total,status:q.status})),
    ...db.invoices.map(i=>({t:i.date,k:"invoice",id:i.id,label:i.number,who:nameOf(db,i.customerId),amt:lineTotals(i.lineItems,i.taxRate).total,status:invoiceStatus(i)})),
  ].sort((a,b)=>b.t.localeCompare(a.t)).slice(0,6);

  return <div>
    <div className="grid" style={{gridTemplateColumns:"repeat(4,1fr)",marginBottom:16}}>
      <Stat label="Open Receivables" value={money(arOut)} tone={arOut>0?"":""} meta={openInv.length+" open invoice"+(openInv.length===1?"":"s")}/>
      <Stat label="Collected · 30d" value={money(collected30)} tone="pos" meta="payments received"/>
      <Stat label="Payables Due" value={money(apOut)} tone={apOut>0?"neg":""} meta={db.bills.length+" vendor bill"+(db.bills.length===1?"":"s")}/>
      <Stat label="Expenses · 30d" value={money(exp30)} tone="" meta="recorded spend"/>
    </div>

    <div className="card" style={{marginBottom:16}}>
      <div className="card-head"><h3>Quote-to-Cash Pipeline</h3><span className="subtle" style={{marginLeft:"auto"}}>Where value sits right now</span></div>
      <div className="pipeline">
        <div className="stage q">
          <div className="st-lbl"><span className="marker"></span>Quotes Out</div>
          <div className="st-count">{openQuotes.length}</div>
          <div className="st-val">{money(valQ)}</div>
          <div className="arrow"><Ico d={ICONS.arrow} size={11}/></div>
        </div>
        <div className="stage s">
          <div className="st-lbl"><span className="marker"></span>Sales Orders</div>
          <div className="st-count">{openSOs.length}</div>
          <div className="st-val">{money(valS)}</div>
          <div className="arrow"><Ico d={ICONS.arrow} size={11}/></div>
        </div>
        <div className="stage i">
          <div className="st-lbl"><span className="marker"></span>Awaiting Payment</div>
          <div className="st-count">{openInv.length}</div>
          <div className="st-val">{money(valI)}</div>
          <div className="arrow"><Ico d={ICONS.arrow} size={11}/></div>
        </div>
        <div className="stage p">
          <div className="st-lbl"><span className="marker"></span>Collected · 30d</div>
          <div className="st-count">{db.invoices.filter(i=>invoiceStatus(i)==="paid"&&daysBetween(i.date,todayISO())<=60).length}</div>
          <div className="st-val">{money(collected30)}</div>
        </div>
      </div>
    </div>

    {overdue.length>0 &&
      <div className="card" style={{marginBottom:16,borderColor:"var(--neg-wash)"}}>
        <div className="card-head" style={{background:"var(--neg-wash)",borderRadius:"10px 10px 0 0"}}>
          <h3 style={{color:"var(--neg)"}}>{overdue.length} Overdue Invoice{overdue.length>1?"s":""}</h3>
          <span className="mono" style={{marginLeft:"auto",color:"var(--neg)",fontWeight:600}}>{money(sum(overdue,balance))}</span>
        </div>
        <table><tbody>
          {overdue.map(i=><tr key={i.id} className="clickable" onClick={()=>go("invoices")}>
            <td className="doc-id">{i.number}</td><td>{nameOf(db,i.customerId)}</td>
            <td className="subtle">{Math.abs(daysBetween(i.dueDate,todayISO()))} days late</td>
            <td className="num" style={{fontWeight:600}}>{money(balance(i))}</td>
          </tr>)}
        </tbody></table>
      </div>}

    <div className="card">
      <div className="card-head"><h3>Recent Activity</h3></div>
      {recent.length===0
        ? <Empty icon={ICONS.dash} title="Nothing here yet" msg="Create your first quote to start the pipeline." action={<button className="btn primary" onClick={()=>go("quotes")}><Ico d={ICONS.plus} size={15}/>New Quote</button>}/>
        : <table><thead><tr><th>Document</th><th>Customer</th><th>Date</th><th>Status</th><th className="num">Amount</th></tr></thead>
          <tbody>{recent.map((r,i)=><tr key={i} className="clickable" onClick={()=>go(r.k==="quote"?"quotes":"invoices")}>
            <td className="doc-id">{r.label}</td><td>{r.who}</td><td className="subtle">{fmtDate(r.t)}</td>
            <td><Badge status={r.status}/></td><td className="num">{money(r.amt)}</td>
          </tr>)}</tbody></table>}
    </div>
  </div>;
}
function nameOf(db,id){ const c=db.contacts.find(x=>x.id===id); return c?c.name:"—"; }

/* ============================ Quotes ============================ */
function QuotesView({db,setDb,toast,openDoc}){
  const [edit,setEdit]=useState(null); // quote object being edited/created
  const [search,setSearch]=useState("");
  const customers=db.contacts.filter(c=>c.type==="customer");
  const filtered=db.quotes.filter(q=>{
    const s=search.toLowerCase(); if(!s) return true;
    return q.number.toLowerCase().includes(s) || nameOf(db,q.customerId).toLowerCase().includes(s) || (q.status||"").includes(s);
  });

  const startNew=()=>{
    const n=db.settings.quotePrefix+"-"+String(db.settings.counters.quote).padStart(4,"0");
    setEdit({id:uid(),number:n,_new:true,customerId:customers[0]?.id||"",date:todayISO(),
      expiryDate:addDays(todayISO(),30),status:"draft",poNumber:"",
      lineItems:[{id:uid(),desc:"",qty:1,unit:"",unitPrice:0}],taxRate:db.settings.taxRate,notes:""});
  };
  const save=(q)=>{
    setDb(d=>{
      const exists=d.quotes.some(x=>x.id===q.id);
      const quotes=exists?d.quotes.map(x=>x.id===q.id?q:x):[...d.quotes,q];
      const counters=(q._new)?{...d.settings.counters,quote:d.settings.counters.quote+1}:d.settings.counters;
      const clean={...q}; delete clean._new;
      return {...d,quotes:exists?quotes.map(x=>x.id===q.id?clean:x):[...d.quotes,clean],settings:{...d.settings,counters}};
    });
    setEdit(null); toast(q._new?"Quote created":"Quote saved");
  };
  const setStatus=(id,status)=>{ setDb(d=>({...d,quotes:d.quotes.map(q=>q.id===id?{...q,status}:q)})); toast("Marked "+status); };
  const del=(id)=>{ if(!confirm("Delete this quote?"))return; setDb(d=>({...d,quotes:d.quotes.filter(q=>q.id!==id)})); toast("Quote deleted"); };

  const convertToSO=(q)=>{
    const po=prompt("Purchase Order number from customer (optional):", q.poNumber||"");
    if(po===null) return;
    setDb(d=>{
      const n=d.settings.soPrefix+"-"+String(d.settings.counters.so).padStart(4,"0");
      const so={id:uid(),number:n,quoteId:q.id,customerId:q.customerId,poNumber:po,date:todayISO(),
        status:"open",lineItems:q.lineItems.map(li=>({...li,id:uid()})),taxRate:q.taxRate};
      return {...d,
        salesOrders:[...d.salesOrders,so],
        quotes:d.quotes.map(x=>x.id===q.id?{...x,status:"accepted",salesOrderId:so.id,poNumber:po}:x),
        settings:{...d.settings,counters:{...d.settings.counters,so:d.settings.counters.so+1}}};
    });
    toast("Sales order created from "+q.number);
  };

  if(edit) return <QuoteEditor quote={edit} customers={customers} catalog={db.catalog} onCancel={()=>setEdit(null)} onSave={save}/>;

  return <div>
    <div className="toolbar">
      <div className="search"><Ico d={ICONS.search} size={15}/><input className="input" placeholder="Search quotes…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
      <button className="btn primary" style={{marginLeft:"auto"}} onClick={startNew}><Ico d={ICONS.plus} size={15}/>New Quote</button>
    </div>
    <div className="card">
      {db.quotes.length===0
        ? <Empty icon={ICONS.quote} title="No quotes yet" msg="Build a quote with the dynamic line-item form. Accepted quotes convert straight into sales orders."
            action={<button className="btn primary" onClick={startNew}><Ico d={ICONS.plus} size={15}/>New Quote</button>}/>
        : <table><thead><tr><th>Quote</th><th>Customer</th><th>Date</th><th>Valid Until</th><th>Status</th><th className="num">Total</th><th></th></tr></thead>
          <tbody>{filtered.slice().reverse().map(q=>{
            const t=lineTotals(q.lineItems,q.taxRate).total;
            return <tr key={q.id}>
              <td className="doc-id">{q.number}</td>
              <td>{nameOf(db,q.customerId)}</td>
              <td className="subtle">{fmtDate(q.date)}</td>
              <td className="subtle">{fmtDate(q.expiryDate)}</td>
              <td><Badge status={q.status}/></td>
              <td className="num">{money(t)}</td>
              <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
                <button className="btn ghost icon" title="Print" onClick={()=>openDoc("quote",q)}><Ico d={ICONS.print} size={16}/></button>
                <button className="btn ghost icon" title="Edit" onClick={()=>setEdit({...q})}><Ico d={ICONS.edit} size={16}/></button>
                <QuoteMenu q={q} setStatus={setStatus} convert={convertToSO} del={del}/>
              </td>
            </tr>;
          })}</tbody></table>}
    </div>
  </div>;
}
function QuoteMenu({q,setStatus,convert,del}){
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);},[]);
  return <span style={{position:"relative",display:"inline-block"}} ref={ref}>
    <button className="btn ghost icon" onClick={()=>setOpen(o=>!o)} title="More">⋯</button>
    {open&&<div style={{position:"absolute",right:0,top:"100%",background:"#fff",border:"1px solid var(--line)",borderRadius:9,boxShadow:"var(--shadow)",zIndex:30,minWidth:180,padding:6,textAlign:"left"}}>
      {q.status!=="sent"&&<MenuItem onClick={()=>{setStatus(q.id,"sent");setOpen(false);}}>Mark as Sent</MenuItem>}
      {q.status!=="accepted"&&<MenuItem onClick={()=>{setStatus(q.id,"accepted");setOpen(false);}}>Mark as Accepted</MenuItem>}

/* ============================ Receivables ============================ */
function agingBuckets(items,dueOf,balOf){
  const b={cur:0,d30:0,d60:0,d90:0,d90p:0};
  items.forEach(it=>{
    const bal=balOf(it); if(bal<=0)return;
    const overdueDays=daysBetween(dueOf(it),todayISO());
    if(overdueDays<=0)b.cur+=bal; else if(overdueDays<=30)b.d30+=bal; else if(overdueDays<=60)b.d60+=bal; else if(overdueDays<=90)b.d90+=bal; else b.d90p+=bal;
  });
  return b;
}

      {open.length===0
        ? <Empty icon={ICONS.ar} title="Nothing outstanding" msg="All invoices are paid. Receivables shows what customers still owe you, bucketed by age."/>
        : <table><thead><tr><th>Invoice</th><th>Customer</th><th>Due</th><th>Age</th><th>Status</th><th className="num">Balance</th><th></th></tr></thead>

          <datalist id="vend-list">{vendors.map(v=><option key={v.id} value={v.name}/>)}</datalist></Field>
        <Field label="Method"><select className="select" value={edit.method} onChange={e=>setEdit({...edit,method:e.target.value})}>
          {["Credit Card","Check","ACH / Wire","Cash","Other"].map(m=><option key={m}>{m}</option>)}</select></Field>
      </div>
      <Field label="Notes"><textarea className="input" value={edit.notes} onChange={e=>setEdit({...edit,notes:e.target.value})}/></Field>
    </Modal>}
  </div>;
}

/* ============================ Contacts ============================ */
function ContactsView({db,setDb,toast}){
  const [tab,setTab]=useState("customer");
  const [edit,setEdit]=useState(null);
  const list=db.contacts.filter(c=>c.type===tab);
  const save=(c)=>{ setDb(d=>({...d,contacts:d.contacts.some(x=>x.id===c.id)?d.contacts.map(x=>x.id===c.id?c:x):[...d.contacts,c]})); setEdit(null); toast("Saved"); };
  const del=(id)=>{ if(!confirm("Delete this contact?"))return; setDb(d=>({...d,contacts:d.contacts.filter(x=>x.id!==id)})); toast("Deleted"); };
  const startNew=()=>setEdit({id:uid(),type:tab,name:"",contact:"",email:"",phone:"",address:""});
  return <div>
    <div className="toolbar">
      <div className="pill-tabs">
        <button className={tab==="customer"?"on":""} onClick={()=>setTab("customer")}>Customers</button>
        <button className={tab==="vendor"?"on":""} onClick={()=>setTab("vendor")}>Vendors</button>
      </div>
      <button className="btn primary" style={{marginLeft:"auto"}} onClick={startNew}><Ico d={ICONS.plus} size={15}/>New {tab==="customer"?"Customer":"Vendor"}</button>
    </div>
    <div className="card">
      {list.length===0
        ? <Empty icon={ICONS.contacts} title={"No "+tab+"s yet"} msg={"Add "+(tab==="customer"?"the companies you quote and invoice.":"vendors and subs you buy from.")}
            action={<button className="btn primary" onClick={startNew}><Ico d={ICONS.plus} size={15}/>New {tab==="customer"?"Customer":"Vendor"}</button>}/>
        : <table><thead><tr><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th></th></tr></thead>
          <tbody>{list.map(c=>(
            <tr key={c.id}>
              <td style={{fontWeight:600}}>{c.name}</td><td className="subtle">{c.contact||"—"}</td>
              <td className="subtle">{c.email||"—"}</td><td className="mono subtle">{c.phone||"—"}</td>
              <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
                <button className="btn ghost icon" onClick={()=>setEdit({...c})} title="Edit"><Ico d={ICONS.edit} size={15}/></button>
                <button className="btn ghost icon" onClick={()=>del(c.id)} title="Delete"><Ico d={ICONS.trash} size={15}/></button>
              </td>
            </tr>
          ))}</tbody></table>}
    </div>
    {edit&&<Modal title={edit.name?"Edit "+(edit.type):"New "+(edit.type)} onClose={()=>setEdit(null)}
      foot={<><button className="btn" onClick={()=>setEdit(null)}>Cancel</button><button className="btn primary" onClick={()=>save(edit)}>Save</button></>}>
      <div className="row">
        <Field label="Company / Name"><input className="input" value={edit.name} onChange={e=>setEdit({...edit,name:e.target.value})}/></Field>
        <Field label="Contact Person"><input className="input" value={edit.contact} onChange={e=>setEdit({...edit,contact:e.target.value})}/></Field>
      </div>
      <div className="row">
        <Field label="Email"><input className="input" value={edit.email} onChange={e=>setEdit({...edit,email:e.target.value})}/></Field>
        <Field label="Phone"><input className="input" value={edit.phone} onChange={e=>setEdit({...edit,phone:e.target.value})}/></Field>
      </div>
      <Field label="Address"><textarea className="input" value={edit.address} onChange={e=>setEdit({...edit,address:e.target.value})}/></Field>
    </Modal>}
  </div>;
}

/* ============================ Catalog ============================ */
function CatalogView({db,setDb,toast}){
  const [edit,setEdit]=useState(null);
  const save=(c)=>{ setDb(d=>({...d,catalog:d.catalog.some(x=>x.id===c.id)?d.catalog.map(x=>x.id===c.id?c:x):[...d.catalog,c]})); setEdit(null); toast("Saved"); };
  const del=(id)=>{ setDb(d=>({...d,catalog:d.catalog.filter(x=>x.id!==id)})); toast("Removed"); };
  return <div>
    <div className="toolbar">
      <p className="subtle" style={{margin:0}}>Reusable line items you can drop into any quote.</p>
      <button className="btn primary" style={{marginLeft:"auto"}} onClick={()=>setEdit({id:uid(),desc:"",unit:"each",unitPrice:0})}><Ico d={ICONS.plus} size={15}/>New Item</button>
    </div>
    <div className="card">
      {db.catalog.length===0
        ? <Empty icon={ICONS.catalog} title="Empty catalog" msg="Save the services and parts you quote repeatedly with default pricing."/>
        : <table><thead><tr><th>Description</th><th>Unit</th><th className="num">Unit Price</th><th></th></tr></thead>
          <tbody>{db.catalog.map(c=>(
            <tr key={c.id}>
              <td>{c.desc}</td><td className="subtle">{c.unit}</td><td className="num">{money(c.unitPrice)}</td>
              <td style={{textAlign:"right",whiteSpace:"nowrap"}}>
                <button className="btn ghost icon" onClick={()=>setEdit({...c})}><Ico d={ICONS.edit} size={15}/></button>
                <button className="btn ghost icon" onClick={()=>del(c.id)}><Ico d={ICONS.trash} size={15}/></button>
              </td>
            </tr>
          ))}</tbody></table>}
    </div>
    {edit&&<Modal title={edit.desc?"Edit Item":"New Catalog Item"} onClose={()=>setEdit(null)}
      foot={<><button className="btn" onClick={()=>setEdit(null)}>Cancel</button><button className="btn primary" onClick={()=>save(edit)}>Save</button></>}>
      <Field label="Description"><input className="input" value={edit.desc} onChange={e=>setEdit({...edit,desc:e.target.value})}/></Field>
      <div className="row">
        <Field label="Unit"><input className="input" value={edit.unit} onChange={e=>setEdit({...edit,unit:e.target.value})} placeholder="hour, each, lot…"/></Field>
        <Field label="Default Unit Price"><input className="input mono" type="number" step="any" value={edit.unitPrice} onChange={e=>setEdit({...edit,unitPrice:e.target.value})}/></Field>
      </div>
    </Modal>}
  </div>;
}

/* ============================ Settings ============================ */
function SettingsView({db,setDb,toast}){
  const [s,setS]=useState(db.settings);
  const set=(k,v)=>setS(p=>({...p,[k]:v}));
  const saveAll=()=>{ setDb(d=>({...d,settings:s})); toast("Settings saved"); };
  const clearAll=()=>{ if(confirm("Erase ALL data and start empty? This cannot be undone."))
    { const fresh=seed(); fresh.contacts=[]; fresh.catalog=[]; setDb(fresh); toast("All data cleared"); } };
  const loadSample=()=>{ if(confirm("Replace current data with the sample dataset?")){ setDb(seed()); toast("Sample data loaded"); } };
  const exportData=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ledger-backup-"+todayISO()+".json"; a.click();
  };
  return <div style={{maxWidth:720}}>
    <div className="card" style={{marginBottom:16}}>
      <div className="card-head"><h3>Company</h3></div>
      <div className="card-body">
        <Field label="Company Name"><input className="input" value={s.company} onChange={e=>set("company",e.target.value)}/></Field>
        <Field label="Address"><textarea className="input" value={s.companyAddress} onChange={e=>set("companyAddress",e.target.value)}/></Field>
        <div className="row">
          <Field label="Email"><input className="input" value={s.companyEmail} onChange={e=>set("companyEmail",e.target.value)}/></Field>
          <Field label="Phone"><input className="input" value={s.companyPhone} onChange={e=>set("companyPhone",e.target.value)}/></Field>
        </div>
      </div>
    </div>
    <div className="card" style={{marginBottom:16}}>
      <div className="card-head"><h3>Defaults</h3></div>
      <div className="card-body">
        <div className="row">
          <Field label="Default Tax Rate (%)"><input className="input mono" type="number" step="any" value={s.taxRate} onChange={e=>set("taxRate",Number(e.target.value))}/></Field>
          <Field label="Payment Terms (days)" hint="Sets invoice & bill due dates"><input className="input mono" type="number" value={s.terms} onChange={e=>set("terms",Number(e.target.value))}/></Field>
        </div>
        <div className="row">
          <Field label="Quote Prefix"><input className="input" value={s.quotePrefix} onChange={e=>set("quotePrefix",e.target.value)}/></Field>
          <Field label="SO Prefix"><input className="input" value={s.soPrefix} onChange={e=>set("soPrefix",e.target.value)}/></Field>
          <Field label="Invoice Prefix"><input className="input" value={s.invPrefix} onChange={e=>set("invPrefix",e.target.value)}/></Field>
          <Field label="Bill Prefix"><input className="input" value={s.billPrefix} onChange={e=>set("billPrefix",e.target.value)}/></Field>
        </div>
        <Field label="Default Quote Notes"><textarea className="input" value={s.quoteNotes} onChange={e=>set("quoteNotes",e.target.value)}/></Field>
        <Field label="Default Invoice Notes"><textarea className="input" value={s.invoiceNotes} onChange={e=>set("invoiceNotes",e.target.value)}/></Field>
        <button className="btn primary" onClick={saveAll}><Ico d={ICONS.check} size={15}/>Save Settings</button>
      </div>
    </div>
    <div className="card">
      <div className="card-head"><h3>Data</h3></div>
      <div className="card-body" style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button className="btn" onClick={exportData}>Export Backup (JSON)</button>
        <button className="btn" onClick={loadSample}>Load Sample Data</button>
        <button className="btn danger" onClick={clearAll}><Ico d={ICONS.trash} size={15}/>Clear All Data</button>
      </div>
    </div>
  </div>;
}

/* ============================ App shell ============================ */
const NAV=[
  {group:"Overview",items:[{k:"dashboard",label:"Dashboard",icon:ICONS.dash}]},
  {group:"Sell",items:[
    {k:"quotes",label:"Quotes",icon:ICONS.quote},
    {k:"salesOrders",label:"Sales Orders",icon:ICONS.so},
    {k:"invoices",label:"Invoices",icon:ICONS.inv},
    {k:"receivables",label:"Receivables",icon:ICONS.ar},
  ]},
  {group:"Spend",items:[
    {k:"payables",label:"Payables",icon:ICONS.ap},
    {k:"expenses",label:"Expenses",icon:ICONS.exp},
  ]},
  {group:"Records",items:[
    {k:"contacts",label:"Contacts",icon:ICONS.contacts},
    {k:"catalog",label:"Item Catalog",icon:ICONS.catalog},
    {k:"settings",label:"Settings",icon:ICONS.settings},
  ]},
];
const TITLES={dashboard:["Dashboard","Your quote-to-cash pipeline at a glance"],quotes:["Quotes","Build, send, and track quotes"],
  salesOrders:["Sales Orders","Confirmed orders awaiting invoicing"],invoices:["Invoices","Issued invoices and payments"],
  receivables:["Receivables","What customers owe you, by age"],payables:["Payables","Vendor bills you owe"],
  expenses:["Expenses","Business spend by category"],contacts:["Contacts","Customers and vendors"],
  catalog:["Item Catalog","Reusable quote line items"],settings:["Settings","Company info and defaults"]};

function App(){
  const [db,setDbRaw]=useState(()=>loadState()||seed());
  const [view,setView]=useState("dashboard");
  const [doc,setDoc]=useState(null); // {kind,doc}
  const [toastMsg,setToastMsg]=useState(null);
  const [navOpen,setNavOpen]=useState(false);
  const setDb=useCallback((updater)=>setDbRaw(prev=>{const next=typeof updater==="function"?updater(prev):updater; saveState(next); return next;}),[]);
  const toast=useCallback((m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(null),2200); },[]);
  const openDoc=(kind,d)=> setDoc({kind,doc:d});

  const counts={
    quotes:db.quotes.filter(q=>q.status==="draft"||q.status==="sent").length,
    salesOrders:db.salesOrders.filter(s=>s.status==="open").length,
    invoices:db.invoices.filter(i=>["unpaid","partial","overdue"].includes(invoiceStatus(i))).length,
    payables:db.bills.filter(b=>((Number(b.amount)||0)-paid(b))>0.005).length,
  };
  const go=(v)=>{setView(v);setNavOpen(false);window.scrollTo(0,0);};

  const [t,sub]=TITLES[view];

  return <div className="app">
    <div className={cls("sidebar",navOpen&&"open")}>
      <div className="brand">
        <div className="brand-mark">L</div>
        <div><div className="brand-name">Ledger</div><div className="brand-sub">Quote → Cash</div></div>
      </div>
      <nav className="nav">
        {NAV.map(g=><div key={g.group}>
          <div className="nav-group">{g.group}</div>
          {g.items.map(it=><button key={it.k} className={cls("nav-item",view===it.k&&"active")} onClick={()=>go(it.k)}>
            <Ico d={it.icon} size={17}/>{it.label}
            {counts[it.k]>0 && <span className="count">{counts[it.k]}</span>}
          </button>)}
        </div>)}
      </nav>
      <div className="sidebar-foot">{db.settings.company||"Your Company"}</div>
    </div>

    <div className="main">
      <div className="topbar">
        <button className="btn ghost icon menu-btn" onClick={()=>setNavOpen(o=>!o)}><Ico d={ICONS.menu} size={20}/></button>
        <div><h1>{t}</h1><div className="sub">{sub}</div></div>
      </div>
      <div className="content">
        {view==="dashboard"&&<Dashboard db={db} go={go}/>}
        {view==="quotes"&&<QuotesView db={db} setDb={setDb} toast={toast} openDoc={openDoc}/>}
        {view==="salesOrders"&&<SalesOrdersView db={db} setDb={setDb} toast={toast}/>}
        {view==="invoices"&&<InvoicesView db={db} setDb={setDb} toast={toast} openDoc={openDoc}/>}
        {view==="receivables"&&<ReceivablesView db={db} setDb={setDb} toast={toast} openDoc={openDoc}/>}
        {view==="payables"&&<PayablesView db={db} setDb={setDb} toast={toast}/>}
        {view==="expenses"&&<ExpensesView db={db} setDb={setDb} toast={toast}/>}
        {view==="contacts"&&<ContactsView db={db} setDb={setDb} toast={toast}/>}
        {view==="catalog"&&<CatalogView db={db} setDb={setDb} toast={toast}/>}
        {view==="settings"&&<SettingsView db={db} setDb={setDb} toast={toast}/>}
      </div>
    </div>

    {doc&&<DocumentView kind={doc.kind} doc={doc.doc}
      contact={db.contacts.find(c=>c.id===doc.doc.customerId)} settings={db.settings} onClose={()=>setDoc(null)}/>}
    {toastMsg&&<div className="toast"><Ico d={ICONS.check} size={16}/>{toastMsg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
